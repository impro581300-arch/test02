<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지자체 협력사업 예산 자동 판정</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: #f4f6f9;
      color: #1f2937;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 20px 60px;
    }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 10px; font-size: 30px; }
    .subtitle { margin: 0; color: #667085; line-height: 1.6; }
    .rule {
      margin-top: 16px;
      padding: 14px 16px;
      background: #eef4ff;
      border: 1px solid #c7d7fe;
      border-radius: 10px;
      color: #344054;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 26px 0;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 14px rgba(16,24,40,.06);
      border: 1px solid #eaecf0;
    }
    .card .label { color: #667085; font-size: 14px; margin-bottom: 8px; }
    .card .value { font-size: 30px; font-weight: 800; }
    .approved .value { color: #067647; }
    .rejected .value { color: #b42318; }
    .amount .value { color: #175cd3; }
    .table-wrap {
      background: white;
      border: 1px solid #eaecf0;
      border-radius: 14px;
      overflow-x: auto;
      box-shadow: 0 4px 14px rgba(16,24,40,.05);
    }
    table { width: 100%; border-collapse: collapse; min-width: 850px; }
    th, td {
      padding: 15px 14px;
      border-bottom: 1px solid #eaecf0;
      text-align: center;
      white-space: nowrap;
    }
    th { background: #f9fafb; color: #475467; font-size: 14px; }
    tbody tr:hover { background: #fcfcfd; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .badge {
      display: inline-block;
      min-width: 58px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }
    .badge.approve { background: #ecfdf3; color: #067647; }
    .badge.reject { background: #fef3f2; color: #b42318; }
    footer {
      margin-top: 18px;
      color: #667085;
      font-size: 13px;
      text-align: right;
    }
    @media (max-width: 760px) {
      .summary { grid-template-columns: 1fr; }
      h1 { font-size: 24px; }
      .container { padding: 24px 14px 40px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>지자체별 협력사업 예산 승인·반려 자동 판정</h1>
      <p class="subtitle">지자체 인구수를 기준으로 신청 가능 한도액을 자동 계산하고 신청액 초과 여부를 판정합니다.</p>
      <div class="rule">
        <strong>심사규칙</strong> · 한도액 = 인구수 × 10원 · 신청액이 한도액보다 크면 <strong>반려</strong>, 작거나 같으면 <strong>승인</strong>
      </div>
    </header>

    <section class="summary">
      <div class="card approved">
        <div class="label">승인 건수</div>
        <div class="value" id="approvedCount">0건</div>
      </div>
      <div class="card rejected">
        <div class="label">반려 건수</div>
        <div class="value" id="rejectedCount">0건</div>
      </div>
      <div class="card amount">
        <div class="label">승인 신청액 합계</div>
        <div class="value" id="approvedAmount">0원</div>
      </div>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>번호</th>
            <th>지자체명</th>
            <th>인구수</th>
            <th>신청액</th>
            <th>한도액</th>
            <th>차액(한도-신청)</th>
            <th>판정결과</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </section>

    <footer>자동 판정 기준: 신청액 ≤ 한도액 → 승인 / 신청액 &gt; 한도액 → 반려</footer>
  </main>

  <script>
    const municipalities = [
      { name: "가람군", population: 30000, amount: 250000 },
      { name: "나봄시", population: 45000, amount: 500000 },
      { name: "다솔구", population: 80000, amount: 600000 },
      { name: "라윤시", population: 60000, amount: 700000 },
      { name: "마을군", population: 25000, amount: 200000 },
      { name: "바람시", population: 100000, amount: 950000 },
      { name: "사계구", population: 55000, amount: 600000 },
      { name: "아현시", population: 70000, amount: 650000 },
      { name: "자연군", population: 40000, amount: 380000 },
      { name: "차돌시", population: 90000, amount: 880000 }
    ];

    const fmt = n => Number(n).toLocaleString("ko-KR");
    const body = document.getElementById("resultBody");

    let approvedCount = 0;
    let rejectedCount = 0;
    let approvedAmount = 0;

    municipalities.forEach((item, index) => {
      const limit = item.population * 10;
      const difference = limit - item.amount;
      const approved = item.amount <= limit;

      if (approved) {
        approvedCount++;
        approvedAmount += item.amount;
      } else {
        rejectedCount++;
      }

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td><strong>${item.name}</strong></td>
        <td class="num">${fmt(item.population)}명</td>
        <td class="num">${fmt(item.amount)}원</td>
        <td class="num">${fmt(limit)}원</td>
        <td class="num">${difference >= 0 ? "+" : ""}${fmt(difference)}원</td>
        <td><span class="badge ${approved ? "approve" : "reject"}">${approved ? "승인" : "반려"}</span></td>
      `;
      body.appendChild(tr);
    });

    document.getElementById("approvedCount").textContent = `${approvedCount}건`;
    document.getElementById("rejectedCount").textContent = `${rejectedCount}건`;
    document.getElementById("approvedAmount").textContent = `${fmt(approvedAmount)}원`;
  </script>
</body>
</html>
